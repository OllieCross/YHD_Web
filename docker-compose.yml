name: yhd

services:
  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: yhd-web
    restart: unless-stopped
    ports:
      # localhost only — public traffic goes through the reverse proxy
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./site:/usr/share/nginx/html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - sync

  sync:
    build: ./sync
    container_name: yhd-sync
    restart: unless-stopped
    env_file: .env
    environment:
      - NOTION_PAGE_ID=${NOTION_PAGE_ID:-10a4d8e1-ab78-80fb-aeb2-eaf93f38583c}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}
    volumes:
      # media/ and index.html are both generated here, straight from Notion
      - ./site:/out
    user: "node"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
