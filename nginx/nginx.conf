worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # unprivileged image: writable paths under /tmp
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;

  client_max_body_size 1m;
  client_body_timeout 10s;
  client_header_timeout 10s;

  limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;

  gzip on;
  gzip_types text/css application/javascript text/plain image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=perip burst=40 nodelay;

    # only GET/HEAD make sense for a static site
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # never serve dotfiles or backup/temp artifacts
    location ~ /\. { deny all; return 404; }
    location ~ ~$ { deny all; return 404; }

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # site is fully self-contained: everything comes from 'self'
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # static assets: long cache, HTML: always revalidate
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|pdf|heic)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    location = /index.html {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
